openapi: 3.1.0
info:
  title: TIET Campus Social API
  version: 0.1.0
  description: Public REST contract for the Next.js client and Express API.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Identity
    description: Onboarding, profiles, account lifecycle, and data rights.
  - name: Content
    description: Uploads, posts, reels, comments, reactions, and saves.
  - name: Feed
    description: Ranked discovery and batched engagement events.
  - name: Communities
    description: Campus community requests, membership, and governance.
  - name: Messaging
    description: Private direct and group conversations.
  - name: Stories
    description: Ephemeral Stories, views, replies, polls, and highlights.
  - name: Moderation
    description: Reports, cases, decisions, and appeals.
  - name: Administration
    description: Privileged role, user, feature-flag, and audit operations.
paths:
  /onboarding:
    post:
      tags: [Identity]
      summary: Complete institutional onboarding
      operationId: completeOnboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingRequest"
      responses:
        "201":
          description: Onboarding completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /profiles/{username}:
    get:
      tags: [Identity]
      summary: Retrieve a campus profile
      operationId: getProfile
      parameters:
        - $ref: "#/components/parameters/Username"
      responses:
        "200":
          description: Campus-visible profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /profiles/{profileId}/follow:
    post:
      tags: [Identity]
      summary: Follow a campus profile
      operationId: followProfile
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "204": { description: Profile followed. }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Identity]
      summary: Unfollow a campus profile
      operationId: unfollowProfile
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "204": { description: Follow removed. }
        "404": { $ref: "#/components/responses/NotFound" }
  /profiles/{profileId}/block:
    post:
      tags: [Identity]
      summary: Block a campus profile
      operationId: blockProfile
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "204":
          { description: Profile blocked and active relationships restricted. }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Identity]
      summary: Unblock a campus profile
      operationId: unblockProfile
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "204": { description: Block removed. }
        "404": { $ref: "#/components/responses/NotFound" }
  /search:
    get:
      tags: [Feed]
      summary: Search profiles, communities, hashtags, and content
      operationId: searchCampus
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: type
          in: query
          schema:
            {
              enum: [all, profiles, communities, hashtags, content],
              default: all,
            }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Authorized search results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchPage" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /uploads:
    post:
      tags: [Content]
      summary: Create a signed quarantine upload session
      operationId: createUploadSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "201":
          description: Signed resumable quarantine upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        "429":
          $ref: "#/components/responses/RateLimited"
  /content:
    post:
      tags: [Content]
      summary: Submit a post or reel for moderation
      operationId: submitContent
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitContentRequest"
      responses:
        "202":
          description: Content accepted for moderation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /content/{contentId}:
    get:
      tags: [Content]
      summary: Retrieve authorized content
      operationId: getContent
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: Authorized content view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Content]
      summary: Soft-delete owned content
      operationId: deleteContent
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "204":
          description: Content entered soft-deletion period.
        "404":
          $ref: "#/components/responses/NotFound"
  /content/{contentId}/comments:
    post:
      tags: [Content]
      summary: Submit a comment for moderation
      operationId: submitComment
      parameters:
        - $ref: "#/components/parameters/ContentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
                parentCommentId: { type: [string, "null"], format: uuid }
      responses:
        "202": { description: Comment accepted for moderation. }
        "404": { $ref: "#/components/responses/NotFound" }
  /content/{contentId}/reactions:
    put:
      tags: [Content]
      summary: Add or replace the current reaction
      operationId: setContentReaction
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "204": { description: Reaction stored. }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Content]
      summary: Remove the current reaction
      operationId: removeContentReaction
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "204": { description: Reaction removed. }
        "404": { $ref: "#/components/responses/NotFound" }
  /content/{contentId}/save:
    put:
      tags: [Content]
      summary: Save content to the private collection
      operationId: saveContent
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "204": { description: Content saved. }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Content]
      summary: Remove content from the private collection
      operationId: unsaveContent
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "204": { description: Saved entry removed. }
        "404": { $ref: "#/components/responses/NotFound" }
  /feeds/discover:
    get:
      tags: [Feed]
      summary: Retrieve the ranked discovery feed
      operationId: getDiscoverFeed
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Ranked campus feed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPage"
  /feed-events:
    post:
      tags: [Feed]
      summary: Record batched feed engagement events
      operationId: recordFeedEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: "#/components/schemas/FeedEvent"
      responses:
        "202":
          description: Events accepted.
  /community-requests:
    post:
      tags: [Communities]
      summary: Request creation of a campus community
      operationId: requestCommunity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityRequest"
      responses:
        "201":
          description: Request created.
  /conversations:
    get:
      tags: [Messaging]
      summary: List the current member's conversations
      operationId: listConversations
      responses:
        "200":
          description: Current user's conversations.
    post:
      tags: [Messaging]
      summary: Create a direct or group conversation
      operationId: createConversation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: Conversation created or existing direct conversation returned.
  /conversations/{conversationId}/messages:
    get:
      tags: [Messaging]
      summary: List messages in an authorized conversation
      operationId: listMessages
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Authorized message page.
    post:
      tags: [Messaging]
      summary: Submit a message for moderation and delivery
      operationId: submitMessage
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitMessageRequest"
      responses:
        "202":
          description: Message accepted for moderation/delivery.
  /stories:
    post:
      tags: [Stories]
      summary: Submit a Story for moderation
      operationId: submitStory
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitStoryRequest"
      responses:
        "202":
          description: Story accepted for moderation.
  /reports:
    post:
      tags: [Moderation]
      summary: Report a profile or content target
      operationId: createReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportRequest"
      responses:
        "201":
          description: Report recorded.
  /moderation/cases/{caseId}/decision:
    post:
      tags: [Moderation]
      summary: Record an administrator moderation decision
      operationId: decideModerationCase
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationDecisionRequest"
      responses:
        "200":
          description: Decision recorded and audited.
        "403":
          $ref: "#/components/responses/Forbidden"
  /moderation/cases:
    get:
      tags: [Moderation]
      summary: List authorized moderation cases
      operationId: listModerationCases
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: Moderation queue page. }
        "403": { $ref: "#/components/responses/Forbidden" }
  /moderation/decisions/{decisionId}/appeals:
    post:
      tags: [Moderation]
      summary: Appeal an eligible moderation decision
      operationId: appealModerationDecision
      parameters:
        - $ref: "#/components/parameters/DecisionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppealRequest" }
      responses:
        "201": { description: Appeal recorded. }
        "409": { $ref: "#/components/responses/Conflict" }
  /notifications:
    get:
      tags: [Identity]
      summary: List the current member's notifications
      operationId: listNotifications
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: Notification page. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /notifications/read-all:
    post:
      tags: [Identity]
      summary: Mark every current notification as read
      operationId: readAllNotifications
      responses:
        "204": { description: Notifications marked as read. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/feature-flags/{flagKey}:
    put:
      tags: [Administration]
      summary: Update a server-side feature flag
      operationId: updateFeatureFlag
      parameters:
        - name: flagKey
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z][a-z0-9_.-]{2,80}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeatureFlagUpdate" }
      responses:
        "200": { description: Feature flag updated and audited. }
        "403": { $ref: "#/components/responses/Forbidden" }
  /me/data-export:
    post:
      tags: [Identity]
      summary: Request a personal-data export
      operationId: requestDataExport
      responses:
        "202":
          description: Export job accepted.
  /me/deletion:
    post:
      tags: [Identity]
      summary: Start the account-deletion recovery period
      operationId: requestAccountDeletion
      responses:
        "202":
          description: Thirty-day deletion recovery period started.
    delete:
      tags: [Identity]
      summary: Cancel a pending account deletion
      operationId: cancelAccountDeletion
      responses:
        "204":
          description: Pending deletion cancelled.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Username:
      name: username
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9_]{3,30}$" }
    ContentId:
      name: contentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DecisionId:
      name: decisionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 1024 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
  schemas:
    OnboardingRequest:
      type: object
      required: [username, displayName, acceptedDocuments]
      properties:
        username: { type: string, pattern: "^[a-z0-9_]{3,30}$" }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        acceptedDocuments:
          type: object
          required: [terms, privacy, guidelines]
          properties:
            terms: { type: string }
            privacy: { type: string }
            guidelines: { type: string }
      additionalProperties: false
    Profile:
      type: object
      required: [id, username, displayName, role, accountStatus]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        bio: { type: [string, "null"] }
        avatarUrl: { type: [string, "null"], format: uri }
        role: { enum: [member, admin, super_admin] }
        accountStatus:
          { enum: [active, warned, suspended, banned, pending_deletion] }
    ProfileResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Profile" }
    UploadRequest:
      type: object
      required: [purpose, fileName, mimeType, sizeBytes, checksumSha256]
      properties:
        purpose: { enum: [post, reel, story, message, avatar] }
        fileName: { type: string, minLength: 1, maxLength: 255 }
        mimeType: { type: string }
        sizeBytes: { type: integer, minimum: 1, maximum: 52428800 }
        checksumSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
    UploadSession:
      type: object
      required: [assetId, objectKey, uploadUrl, expiresAt, protocol]
      properties:
        assetId: { type: string, format: uuid }
        objectKey: { type: string }
        uploadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        protocol: { enum: [standard, tus] }
    SubmitContentRequest:
      type: object
      required: [type, visibility, mediaAssetIds]
      properties:
        type: { enum: [post, reel] }
        visibility: { enum: [campus, followers, community] }
        communityId: { type: [string, "null"], format: uuid }
        caption: { type: [string, "null"], maxLength: 2200 }
        mediaAssetIds:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: { type: string, format: uuid }
    Content:
      type: object
      required: [id, author, type, visibility, moderationStatus, createdAt]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/Profile" }
        type: { enum: [post, reel] }
        visibility: { enum: [campus, followers, community] }
        moderationStatus: { enum: [pending_scan, approved, flagged, rejected] }
        caption: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    ContentResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Content" }
    ContentPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Content" }
        page: { $ref: "#/components/schemas/PageInfo" }
    PageInfo:
      type: object
      required: [hasMore]
      properties:
        nextCursor: { type: [string, "null"] }
        hasMore: { type: boolean }
    SearchPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            type: object
            required: [type, id, label]
            properties:
              type: { enum: [profile, community, hashtag, content] }
              id: { type: string }
              label: { type: string }
              description: { type: [string, "null"] }
        page: { $ref: "#/components/schemas/PageInfo" }
    FeedEvent:
      type: object
      required: [contentId, action, rankingVersion, occurredAt]
      properties:
        contentId: { type: string, format: uuid }
        action: { enum: [impression, play, pause, complete, skip] }
        watchMs: { type: integer, minimum: 0 }
        rankingVersion: { type: string }
        occurredAt: { type: string, format: date-time }
    CommunityRequest:
      type: object
      required: [name, slug, purpose]
      properties:
        name: { type: string, minLength: 3, maxLength: 80 }
        slug: { type: string, pattern: "^[a-z0-9-]{3,50}$" }
        purpose: { type: string, minLength: 20, maxLength: 1000 }
    CreateConversationRequest:
      type: object
      required: [participantIds]
      properties:
        title: { type: [string, "null"], maxLength: 80 }
        participantIds:
          type: array
          minItems: 1
          maxItems: 24
          uniqueItems: true
          items: { type: string, format: uuid }
    SubmitMessageRequest:
      type: object
      properties:
        body: { type: [string, "null"], maxLength: 4000 }
        replyToMessageId: { type: [string, "null"], format: uuid }
        mediaAssetIds:
          type: array
          maxItems: 4
          uniqueItems: true
          items: { type: string, format: uuid }
      anyOf:
        - required: [body]
        - required: [mediaAssetIds]
    SubmitStoryRequest:
      type: object
      required: [visibility, mediaAssetId]
      properties:
        visibility: { enum: [campus, followers] }
        mediaAssetId: { type: string, format: uuid }
        overlays: { type: array, maxItems: 20, items: { type: object } }
    CreateReportRequest:
      type: object
      required: [targetType, targetId, category]
      properties:
        targetType:
          { enum: [profile, content, comment, message, community, story] }
        targetId: { type: string, format: uuid }
        category:
          {
            enum:
              [
                sexual,
                violence,
                harassment,
                hate,
                privacy,
                impersonation,
                copyright,
                spam,
                other,
              ],
          }
        description: { type: [string, "null"], maxLength: 2000 }
    ModerationDecisionRequest:
      type: object
      required: [action, reasonCode, explanation]
      properties:
        action:
          { enum: [approve, reject, warn, suspend_24h, suspend_7d, escalate] }
        reasonCode: { type: string, minLength: 2, maxLength: 80 }
        explanation: { type: string, minLength: 10, maxLength: 2000 }
    AppealRequest:
      type: object
      required: [argument]
      properties:
        argument: { type: string, minLength: 10, maxLength: 2000 }
      additionalProperties: false
    FeatureFlagUpdate:
      type: object
      required: [enabled, rolloutPercentage]
      properties:
        enabled: { type: boolean }
        rolloutPercentage: { type: integer, minimum: 0, maximum: 100 }
        allowedUserIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
      additionalProperties: false
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details: { type: object }
  responses:
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Caller is not allowed to perform the action.
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Resource does not exist or is not visible to the caller.
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Request conflicts with current state.
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ValidationFailed:
      description: Request validation failed.
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
